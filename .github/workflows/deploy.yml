name: Deploy

# DISABLED UNTIL M10.
#
# This workflow is written now so the deployment path is reviewable alongside
# the code it deploys, rather than being invented under pressure at the end.
# It is intentionally manual-dispatch only: no AWS account, EC2 instance or
# Terraform state exists yet, so an automatic trigger would only ever fail.
#
# To enable at M10:
#   1. Provision the box:  cd deploy/terraform && terraform apply
#   2. Add repository secrets: AWS_DEPLOY_ROLE_ARN, EC2_HOST, EC2_SSH_KEY
#   3. Add `push: branches: [main]` to the triggers below
#
# Authentication uses OIDC, not long-lived access keys. An IAM role trusted by
# GitHub's OIDC provider is assumed per run, so no AWS credential is ever
# stored in this repository.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: uat
        type: choice
        options: [uat, prod]

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

concurrency:
  # Never let two deploys to the same environment overlap.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        # Tag by commit SHA, never `latest`. A deploy must name exactly one
        # immutable artefact, or a rollback has nothing precise to roll back to.
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/cache-gateway:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Pull the new image, migrate, then restart
        # Ordering matters: migrations run before the new container serves
        # traffic, and they must be backward compatible with the currently
        # running version, because for a moment both are live.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/cache-gateway
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin "${{ needs.build-and-push.outputs.image }}"
            export IMAGE="${{ needs.build-and-push.outputs.image }}"
            docker compose pull api
            docker compose run --rm api alembic upgrade head
            docker compose up -d --no-deps api

      - name: Verify the deployed instance is serving
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8000/healthz"; then
              echo "deploy verified"; exit 0
            fi
            sleep 2
          done
          echo "deployed instance never answered liveness"
          exit 1
