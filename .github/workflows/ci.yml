name: CI

on:
  # Every PR, whatever its base -- feature -> uat and uat -> main both gate here.
  pull_request:
  push:
    branches: [main, uat]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, docstrings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements/dev.txt

      - name: ruff (lint)
        run: .venv/bin/ruff check .

      - name: ruff (format)
        run: .venv/bin/ruff format --check .

      - name: mypy (strict)
        run: .venv/bin/mypy src

      - name: darglint (docstrings match signatures)
        run: find src -name '*.py' -print0 | xargs -0 .venv/bin/darglint -v 2

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements/dev.txt

      - name: Unit tests
        run: .venv/bin/pytest -q -m 'not integration' --cov --cov-report=xml
        env:
          PYTHONPATH: .

      - name: Integration tests
        # testcontainers starts real Postgres and Redis. Kept in a separate
        # step so a failure here is instantly distinguishable from a unit
        # failure in the run summary.
        #
        # pytest exits 5 when a marker selects nothing. There are no
        # integration tests until M2, and "none written yet" is not a failure
        # -- but every other non-zero code still is, so a genuinely broken
        # integration test cannot hide behind this.
        run: |
          set +e
          .venv/bin/pytest -q -m integration
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice::No integration tests collected yet (expected until M2)."
            exit 0
          fi
          exit "$code"
        env:
          PYTHONPATH: .

  contracts:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements/dev.txt

      - name: OpenAPI spec is current
        # The dashboard's TypeScript client is generated from this file. If it
        # drifts, the frontend compiles against a contract the backend no
        # longer serves.
        run: |
          .venv/bin/python -m scripts.export_openapi /tmp/openapi.json
          diff -u api/openapi.json /tmp/openapi.json
        env:
          PYTHONPATH: .

      - name: Single Alembic head
        run: .venv/bin/python -m scripts.check_single_head
        env:
          PYTHONPATH: .

      - name: Requirements lockfiles are current
        # Catches an edit to a .in file that was never recompiled.
        run: |
          .venv/bin/pip-compile --quiet --generate-hashes --strip-extras \
            --output-file=/tmp/base.txt requirements/base.in
          diff -u <(grep -v '^#' requirements/base.txt) <(grep -v '^#' /tmp/base.txt)

  container:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: cache-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts and answers liveness
        # Building is not proof the image runs. This catches a missing runtime
        # library or a bad CMD, which a build alone will not.
        #
        # Bloom filter disabled for the smoke test: the filter builds from Postgres
        # at startup, but this test deliberately uses a dummy DATABASE_URL to prove
        # the container image itself is valid. M4+ requires BLOOM_ENABLED=false here.
        run: |
          docker run -d --name cg -p 8000:8000 \
            -e DATABASE_URL='postgresql+asyncpg://u:p@localhost:5432/d' \
            -e REDIS_URL='redis://localhost:6379/0' \
            -e WEB_CONCURRENCY=1 \
            -e BLOOM_ENABLED=false \
            cache-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo "\nliveness OK"; exit 0; fi
            sleep 1
          done
          echo "container did not become live:"
          docker logs cg
          exit 1

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned, and >= 1.10 because the S3 backend uses native locking
          # (use_lockfile) instead of a DynamoDB table.
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Formatting
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate
        # -backend=false so validation needs no AWS credentials and no access to
        # the state bucket. This job checks that the configuration is coherent,
        # not that it matches deployed reality.
        run: |
          for d in deploy/terraform/modules/single-box-service deploy/terraform/envs/prod; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
