# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL comes from DATABASE_URL via
# the application settings in migrations/env.py. Keeping a connection string
# in a committed file is how credentials end up in git.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped revision ids sort chronologically in the versions/ listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
