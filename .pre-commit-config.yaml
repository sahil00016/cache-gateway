# Pre-commit hooks.
#
# These are the fast checks only. Anything slow (integration tests, Docker
# build) belongs in CI: a hook that makes committing painful gets bypassed with
# --no-verify, and then it protects nothing.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run from the local venv rather than an isolated environment, so the
      # hook type-checks against exactly the dependencies the service uses.
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args: [src]

      - id: darglint
        name: darglint (docstrings match signatures)
        entry: .venv/bin/darglint -v 2
        language: system
        types: [python]
        files: ^src/

      - id: openapi-drift
        name: OpenAPI spec is current
        entry: bash -c 'PYTHONPATH=. .venv/bin/python -m scripts.export_openapi api/openapi.json'
        language: system
        pass_filenames: false
        files: ^(src/|scripts/export_openapi\.py)
